spring.application.name=exe-padroes-de-projeto-spring
spring.docker.compose.lifecycle-management=start-only

# Conexao do Spring com o docker
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Cria o banco automaticamente caso ele nao exista no Docker
spring.flyway.create-schemas=true
